<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gloss</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply the theme before first paint to avoid a flash (logic mirrors src/app/theme/theme.ts).
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('translator.theme') || 'system';
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Static copy of the loading screen (src/app/layout/LoadingScreen.tsx, D48), shown
        while the code downloads; React replaces it with the same screen. Its texts mirror
        loadingScreen.* in src/i18n/locales (a test keeps them in step).
      -->
      <div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-app opacity-100">
        <svg aria-hidden="true" viewBox="0 0 80 80" width="72" height="72" class="size-18">
          <rect x="4" y="13" width="44" height="22" rx="11" class="fill-text" />
          <circle cx="65" cy="24" r="11" class="gloss-pulse fill-accent-text" />
          <circle cx="15" cy="56" r="11" class="gloss-pulse gloss-pulse-late fill-accent-text" />
          <rect x="32" y="45" width="44" height="22" rx="11" class="fill-text" />
        </svg>
        <p class="mt-5 text-[28px] leading-none font-semibold tracking-tight text-text">Gloss</p>
        <p id="boot-message" role="status" class="mt-3 text-sm text-text-tertiary">
          Loading your workspace…
        </p>
      </div>
      <script>
        (function () {
          var messages = {
            en: { workspace: 'Loading your workspace…', demo: 'Loading the demo workspace…' },
            es: {
              workspace: 'Cargando tu espacio de trabajo…',
              demo: 'Cargando el espacio de trabajo de la demo…',
            },
          };
          var language = navigator.language;
          var workspace = 'own';
          try {
            language = localStorage.getItem('translator.uiLanguage') || language;
            workspace = localStorage.getItem('translator.workspace') || workspace;
          } catch (e) {}
          var texts = messages[String(language).slice(0, 2) === 'es' ? 'es' : 'en'];
          document.getElementById('boot-message').textContent =
            workspace === 'demo' ? texts.demo : texts.workspace;
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
